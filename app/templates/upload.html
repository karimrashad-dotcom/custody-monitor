{% extends "base.html" %}
{% block content %}
<h1>رفع فاتورة</h1>
<form class="card" method="post" action="/upload" enctype="multipart/form-data" id="upform">
  {% if custodies|length > 1 %}
  <div class="field"><label>العهدة</label>
    <select name="custody_id">{% for c in custodies %}<option value="{{ c.id }}" {% if c.id == selected %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select>
  </div>
  {% else %}<input type="hidden" name="custody_id" value="{{ custodies[0].id }}">{% endif %}
  <div class="camera-box">
    <div>صوّر الفاتورة كلها في إضاءة كويسة، أو اختار صورتها من المعرض.</div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <label class="btn primary" style="color:#fff;margin:0">📷 صوّر بالكاميرا
        <input type="file" accept="image/*" capture="environment" id="cam" hidden></label>
      <label class="btn" style="margin:0">🖼️ اختار صورة أو PDF
        <input type="file" accept="image/*,application/pdf,.pdf" id="gal" hidden></label>
    </div>
    <input type="file" name="image" accept="image/*,application/pdf,.pdf" required id="img" style="position:absolute;opacity:0;width:1px;height:1px">
    <img id="preview" alt="">
  </div>
  <div style="margin-top:14px"><button class="btn primary big" id="send">اقرأ الفاتورة</button></div>
  <div class="loading" id="loading">جاري قراءة الفاتورة… ممكن تاخد لحد 30 ثانية</div>
</form>
<script>
const img = document.getElementById('img'), prev = document.getElementById('preview');
for (const id of ['cam', 'gal']) {
  document.getElementById(id).addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const dt = new DataTransfer(); dt.items.add(f); img.files = dt.files;
    prev.src = URL.createObjectURL(f); prev.style.display = 'block';
  });
}
document.getElementById('upform').addEventListener('submit', () => {
  document.getElementById('send').disabled = true;
  document.getElementById('loading').style.display = 'block';
});
</script>
{% endblock %}
