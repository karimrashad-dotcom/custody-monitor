{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:460px;margin:24px auto">
  <h1>أول تشغيل: حساب مدير النظام</h1>
  <p class="muted">هذا الحساب هو الذي سيضيف الموظفين والعهد ويستقبل التنبيهات.</p>
  <form method="post" action="/setup">
    <div class="field"><label>اسم الشركة</label><input name="company_name"></div>
    <div class="field"><label>اسمك</label><input name="full_name" required></div>
    <div class="field"><label>اسم الدخول (إنجليزي)</label><input name="username" required autocapitalize="none" dir="ltr"></div>
    <div class="field"><label>كلمة السر</label><input name="password" type="password" required minlength="6"></div>
    <button class="btn primary big">إنشاء الحساب</button>
  </form>
</div>
{% endblock %}
