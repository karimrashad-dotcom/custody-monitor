{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:32px auto">
  <h1>تسجيل الدخول</h1>
  <form method="post" action="/login">
    <div class="field"><label>اسم الدخول</label><input name="username" required autocapitalize="none" autocomplete="username" dir="ltr"></div>
    <div class="field"><label>كلمة السر</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn primary big">دخول</button>
  </form>
</div>
{% endblock %}
