{% extends "base.html" %}
{% from "_macros.html" import invoice_table %}
{% block content %}
<div class="row"><h1>الفواتير</h1><span class="spacer"></span>
  <a class="btn sm" href="/admin/export/invoices.xlsx">تصدير كل الفواتير Excel</a></div>
<form class="card" method="get">
  <div class="fields">
    <div class="field"><label>الحالة</label><select name="status">
      {% for k, v in [('pending','بانتظار المراجعة'),('approved','معتمدة'),('rejected','مرفوضة'),('all','الكل')] %}<option value="{{ k }}" {% if f.status == k %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div>
    <div class="field"><label>الموظف</label><select name="user_id"><option value="">الكل</option>
      {% for u in users %}<option value="{{ u.id }}" {% if f.user_id == u.id|string %}selected{% endif %}>{{ u.full_name }}</option>{% endfor %}</select></div>
    <div class="field"><label>التصنيف</label><select name="category_id"><option value="">الكل</option>
      {% for c in categories %}<option value="{{ c.id }}" {% if f.category_id == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>بحث (رقم فاتورة، مورد، رقم ضريبي)</label><input name="q" value="{{ f.q }}"></div>
  </div>
  <div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" name="over" value="1" style="width:auto" {% if f.over %}checked{% endif %}> فوق الحد فقط</label>
    <span class="spacer"></span><button class="btn primary sm">عرض</button></div>
</form>
<div class="card">{{ invoice_table(invoices, show_user=true) }}</div>
{% endblock %}
